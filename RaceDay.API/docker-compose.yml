# Starts the whole RaceDay system with one command:   docker compose up --build
#   raceday-db   SQL Server
#   raceday-api  the Part 2 REST API (creates its own database tables on first start)
#   raceday-mvc  the Part 3 website
# Passwords and keys come from the .env file (copy .env.example to .env and fill it in). Never commit .env.

services:
  raceday-db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: raceday-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${RACEDAY_DB_PASSWORD:?Set RACEDAY_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"      # only reachable from this computer
    volumes:
      - raceday-sql-data:/var/opt/mssql
    networks:
      - raceday-network

  raceday-api:
    container_name: raceday-api
    build:
      context: .
      dockerfile: RaceDay.API/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=raceday-db,1433;Database=RaceDayDb;User Id=sa;Password=${RACEDAY_DB_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__Key: ${RACEDAY_JWT_KEY:?Set RACEDAY_JWT_KEY in .env}
      Jwt__Issuer: RaceDay.API
      Jwt__Audience: RaceDay.Clients
      Jwt__ExpiryMinutes: "180"
      AzureBlobStorage__ConnectionString: ${RACEDAY_AZURE_CONNECTION_STRING:-}
      Database__MigrateOnStartup: "true"      # create/update the tables when the API starts
    ports:
      - "5285:8080"
    depends_on:
      - raceday-db
    networks:
      - raceday-network

  raceday-mvc:
    container_name: raceday-mvc
    build:
      context: RaceDay.MVC
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ApiSettings__BaseUrl: http://raceday-api:8080/
    ports:
      - "8080:8080"
    depends_on:
      - raceday-api
    networks:
      - raceday-network

volumes:
  raceday-sql-data:
    name: raceday-sql-data     # created automatically if it does not exist yet; reused if it does

networks:
  raceday-network:
    driver: bridge
