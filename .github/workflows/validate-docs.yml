# This is a basic workflow to help you get started with Actions

name: Validate Docs Structure

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  validate-docs:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Check /docs folder exits
        uses: actions/checkout@v4

      # Runs a set of commands using the runners shell
      - name: Check /docs folder exists
        run: |
         if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check required files exist in /docs
        run: |
          missing=0

          #ERD image (png or pdf)
          if ! Is docs/*.png docs/*.pdf 1>/dev/null 2>&1; then
             echo "ERROR: No ERD image (.png or .pdf) found in /docs."
             missing=1
          else
             echo "ERD file found."
          fi
          
          # API Endpoint (pdf or markdown)
          if ! Is docs/*endpoint* 1> /dev/null 2>&1; then
            echo "ERROR: No API Endpoint file found in /docs (expeccted filename containing endpoint)."
            missing=1
          else
            echo "API Endpoint found."
          fi

          # SQL script
          if ! Is docs/*.sql 1> /dev/null 2>&1; then
            echo "ERROR: No .sql script found in /docs."
            missing=1
          else
            eccho "SQL script found."
          fi

          if ["$missing" -eq 1 ]; then
            echo "One or more required files are missing from /docs."
            exit 1
          fi

          echo "All required files are present. Validation passed."
