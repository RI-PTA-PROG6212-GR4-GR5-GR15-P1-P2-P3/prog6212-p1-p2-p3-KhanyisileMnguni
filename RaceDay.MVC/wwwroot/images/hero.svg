<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="0.6" stop-color="#12335f"/>
      <stop offset="1" stop-color="#1c4f8f"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <!-- running track lanes -->
  <g fill="none" stroke-linecap="round">
    <path d="M-100 520 C 400 360, 900 380, 1700 140" stroke="#FF5A1F" stroke-width="26" opacity=".95"/>
    <path d="M-100 570 C 420 410, 920 430, 1700 200" stroke="#C6F432" stroke-width="12" opacity=".9"/>
    <path d="M-100 610 C 440 460, 940 480, 1700 255" stroke="#ffffff" stroke-width="6" opacity=".35"/>
    <path d="M-100 640 C 460 510, 960 530, 1700 305" stroke="#ffffff" stroke-width="4" opacity=".2"/>
  </g>
  <!-- speed stripes -->
  <g fill="#ffffff" opacity=".07">
    <rect x="980" y="-40" width="40" height="760" transform="rotate(22 1000 300)"/>
    <rect x="1070" y="-40" width="18" height="760" transform="rotate(22 1000 300)"/>
    <rect x="1130" y="-40" width="60" height="760" transform="rotate(22 1000 300)"/>
  </g>
  <!-- sun -->
  <circle cx="1320" cy="150" r="70" fill="#FF5A1F" opacity=".25"/>
  <circle cx="1320" cy="150" r="38" fill="#C6F432" opacity=".5"/>
</svg>
